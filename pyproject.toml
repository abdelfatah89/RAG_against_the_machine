[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fire>=0.7.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
rag-against-the-machine = "rag_against_the_machine:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
